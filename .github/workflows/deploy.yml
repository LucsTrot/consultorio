name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin la URL de la planilla la app quedaría en modo local (datos en el navegador).
      # Se corta acá para que nunca se publique así por error.
      - name: Verificar URL de la planilla
        run: |
          if [ -z "${{ vars.VITE_SHEETS_URL }}" ]; then
            echo "::error::Falta la variable VITE_SHEETS_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SHEETS_URL: ${{ vars.VITE_SHEETS_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
